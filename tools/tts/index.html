<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text to Speech - My Tools Hub</title>
    <link rel="icon" type="image/x-icon" href="../../assets/img/favicon.png" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Shared Neumorphism DNA -->
    <link rel="stylesheet" href="../../assets/css/neumorphism.css" />
  </head>
  <body
    class="min-h-screen flex items-center justify-center p-3 sm:p-6 font-sans antialiased bg-zinc-900"
  >
    <div
      class="neu-flat w-full max-w-3xl p-4 sm:p-8 flex flex-col gap-4 sm:gap-6"
    >
      <!-- Header & Navigation -->
      <div class="flex items-center gap-4 pb-2">
        <a
          href="../../index.html"
          class="neu-btn w-10 h-10 flex items-center justify-center text-gray-500 hover:text-red-500 transition"
          title="Back to Hub"
        >
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1
          class="text-xl sm:text-2xl font-extrabold tracking-widest text-red-500 uppercase flex items-center gap-2"
        >
          <i class="fa-solid fa-microphone-lines"></i> Text to Speech
        </h1>
      </div>

      <!-- Drop Zone -->
      <div
        id="drop-zone"
        class="neu-pressed flex flex-col items-center justify-center gap-2 p-8 min-h-[120px] cursor-pointer transition"
      >
        <i class="fa-solid fa-file-arrow-up text-3xl text-gray-500"></i>
        <p class="text-sm text-gray-400 font-medium text-center">
          Kéo thả file <span class="text-red-500 font-bold">.txt</span> vào đây,
          hoặc <span class="text-red-500 underline">click để chọn file</span>
        </p>
        <input type="file" id="file-input" accept=".txt" class="hidden" />
      </div>

      <!-- Input Area -->
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <label
            for="input-text"
            class="text-xs font-bold text-gray-500 uppercase tracking-wider"
          >
            Text
          </label>
          <span id="word-count" class="text-xs text-gray-500">0 từ</span>
        </div>
        <textarea
          id="input-text"
          class="neu-pressed w-full min-h-[160px] p-4 text-white bg-transparent outline-none resize-y placeholder-gray-600"
          placeholder="Nội dung file .txt sẽ hiện ở đây, hoặc paste trực tiếp..."
        ></textarea>
      </div>

      <!-- Options -->
      <div class="flex flex-wrap gap-3 items-center">
        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">
            Giọng đọc
          </label>
          <select
            id="voice-select"
            class="neu-btn px-3 py-2 text-sm text-gray-300 bg-transparent outline-none"
          >
            <option value="en-US-AvaMultilingualNeural">
              Ava Multilingual (US)
            </option>
            <option value="en-US-AndrewMultilingualNeural">
              Andrew Multilingual (US)
            </option>
            <option value="en-US-EmmaMultilingualNeural">
              Emma Multilingual (US)
            </option>
            <option value="vi-VN-HoaiMyNeural">Hoài My (VN, nữ)</option>
            <option value="vi-VN-NamMinhNeural">Nam Minh (VN, nam)</option>
          </select>
        </div>

        <div class="flex-1"></div>

        <button
          id="convert-btn"
          class="neu-btn px-5 py-2.5 text-sm text-gray-300 font-semibold flex items-center gap-2"
        >
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          Convert to MP3
        </button>
      </div>

      <!-- Progress Section (hidden until converting) -->
      <div id="progress-section" class="hidden flex-col gap-2">
        <div class="flex items-center justify-between text-xs text-gray-500">
          <span id="progress-status">Đang xử lý...</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="neu-pressed w-full h-3 p-0.5 rounded-full overflow-hidden">
          <div
            id="progress-bar"
            class="h-full bg-red-500 rounded-full transition-all duration-200"
            style="width: 0%"
          ></div>
        </div>
      </div>

      <!-- Log Console -->
      <div
        id="log-console"
        class="neu-pressed hidden flex-col gap-1 p-4 max-h-[160px] overflow-y-auto text-xs font-mono text-gray-400"
      ></div>

      <!-- Download Area (hidden until done) -->
      <div id="download-area" class="hidden justify-center">
        <a
          id="download-link"
          class="neu-btn px-5 py-2.5 text-sm text-red-500 font-semibold flex items-center gap-2"
          download="output.mp3"
        >
          <i class="fa-solid fa-download"></i>
          Download MP3
        </a>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
