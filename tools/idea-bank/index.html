<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idea Bank - My Tools Hub</title>
    <link rel="icon" type="image/x-icon" href="../../assets/img/favicon.png" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Shared Neumorphism DNA -->
    <link rel="stylesheet" href="../../assets/css/neumorphism.css" />
    <style>
      .field {
        background: #18181b;
        box-shadow:
          inset 3px 3px 7px #0a0a0b,
          inset -3px -3px 7px #26262b;
        border-radius: 0.75rem;
        color: #e4e4e7;
        outline: none;
        width: 100%;
        padding: 0.6rem 0.8rem;
        font-size: 0.9rem;
      }
      .field::placeholder {
        color: #52525b;
      }
      .field:focus {
        box-shadow:
          inset 3px 3px 7px #0a0a0b,
          inset -3px -3px 7px #26262b,
          0 0 0 1px rgba(239, 68, 68, 0.45);
      }
      textarea.field {
        resize: vertical;
        min-height: 84px;
        line-height: 1.55;
      }
      .hidden {
        display: none !important;
      }
      .card-used {
        opacity: 0.45;
      }
      .card-selected {
        box-shadow:
          8px 8px 16px #0a0a0b,
          -8px -8px 16px #26262b,
          inset 0 0 0 1px rgba(239, 68, 68, 0.5);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.3rem 0.75rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #a1a1aa;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.07);
        cursor: pointer;
        transition: all 0.15s ease;
        white-space: nowrap;
      }
      .chip:hover {
        color: #fff;
      }
      .chip.active {
        color: #fff;
        background: rgba(239, 68, 68, 0.22);
        border-color: rgba(248, 113, 113, 0.6);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 1.5rem;
        z-index: 80;
        transform: translate(-50%, 1rem);
        padding: 0.65rem 1.1rem;
        border-radius: 999px;
        background: rgba(24, 24, 27, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #e4e4e7;
        font-size: 0.85rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: all 0.2s ease;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    </style>
  </head>
  <body class="min-h-screen flex justify-center p-3 sm:p-6 font-sans antialiased">
    <div class="neu-flat w-full max-w-5xl p-4 sm:p-8 flex flex-col gap-5 sm:gap-7 self-start">
      <!-- Header -->
      <div class="flex flex-wrap items-center gap-4">
        <a
          href="../../index.html"
          class="neu-btn w-10 h-10 flex items-center justify-center text-gray-500 hover:text-red-500 transition"
          title="Back to Hub"
        >
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1 class="text-xl sm:text-2xl font-extrabold tracking-widest text-red-500 uppercase flex items-center gap-2">
          <i class="fa-solid fa-lightbulb"></i> Idea Bank
        </h1>
        <span id="counter" class="text-xs text-gray-500 ml-auto"></span>
      </div>

      <!-- Toolbar -->
      <div class="flex flex-wrap items-center gap-3">
        <button id="addBtn" class="neu-btn px-4 py-2.5 text-sm font-bold text-red-500 flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> New idea
        </button>
        <button id="copyBtn" class="neu-btn px-4 py-2.5 text-sm font-bold text-gray-300 flex items-center gap-2">
          <i class="fa-regular fa-copy"></i> <span id="copyLabel">Copy for Claude</span>
        </button>
        <div class="flex items-center gap-2 ml-auto">
          <button class="chip active" data-filter="active">Active</button>
          <button class="chip" data-filter="used">Used</button>
          <button class="chip" data-filter="all">All</button>
        </div>
      </div>

      <!-- Cards -->
      <div id="list" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>

      <!-- Empty state -->
      <div id="empty" class="neu-pressed hidden flex-col items-center justify-center gap-3 p-10 text-center">
        <i class="fa-regular fa-lightbulb text-3xl text-gray-600"></i>
        <p class="text-gray-500 text-sm">No ideas here yet. Hit <b class="text-red-500">New idea</b> to save one.</p>
      </div>

      <!-- Footer: backup -->
      <div class="flex flex-wrap items-center gap-3 pt-2 border-t border-white/5">
        <p class="text-xs text-gray-500">Saved automatically in this browser.</p>
        <div class="flex gap-2 ml-auto">
          <button id="exportBtn" class="neu-btn px-3 py-2 text-xs text-gray-400 flex items-center gap-2">
            <i class="fa-solid fa-download"></i> Export JSON
          </button>
          <label class="neu-btn px-3 py-2 text-xs text-gray-400 flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-upload"></i> Import JSON
            <input id="importInput" type="file" accept=".json,application/json" class="hidden" />
          </label>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
  </body>
</html>
