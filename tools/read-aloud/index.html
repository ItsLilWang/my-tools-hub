<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Read Aloud - My Tools Hub</title>
    <link rel="icon" type="image/x-icon" href="../../assets/img/favicon.png" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Shared Neumorphism DNA -->
    <link rel="stylesheet" href="../../assets/css/neumorphism.css" />

    <style>
      /* Tự định nghĩa .hidden, không phụ thuộc Tailwind CDN load kịp hay không */
      .hidden {
        display: none !important;
      }
      /* Đoạn văn trong Reader: chữ to, giãn dòng rộng để Edge ngắt giọng tốt */
      #reader-content p {
        margin-bottom: 1.5em;
      }
      /* Ghi đè size mặc định của slider/select trong neumorphism.css */
      .full-range {
        width: 100% !important;
      }
      .wide-select {
        max-width: 100% !important;
      }
      /* Cờ trong công tắc chiều dịch */
      .flag {
        width: 24px;
        height: 16px;
        border-radius: 3px;
        flex-shrink: 0;
      }
      /* Đảo thứ tự cờ khi dịch EN -> VI (mũi tên vẫn ở giữa, vẫn chỉ sang phải) */
      .dir-inner.is-reversed {
        flex-direction: row-reverse;
      }
      /* Vùng cuộn lịch sử: padding chừa chỗ cho bóng đổ */
      .history-scroll {
        max-height: 18rem;
        overflow-y: auto;
        padding: 10px 12px 12px 10px;
      }
      /* Item lịch sử: bóng nhỏ hơn neu-btn để không đè lên nhau */
      .history-item {
        background: #18181b;
        border-radius: 0.75rem;
        box-shadow:
          3px 3px 7px #0a0a0b,
          -3px -3px 7px #26262b;
        transition: all 0.15s ease;
      }
      .history-item:hover {
        box-shadow:
          inset 3px 3px 6px #0a0a0b,
          inset -3px -3px 6px #26262b;
      }
      /* ===== Luyện nhại ===== */
      .seg-btn {
        min-width: 2.25rem;
        padding: 0.25rem 0.5rem;
        font-size: 0.75rem;
        color: #a1a1aa;
        border-radius: 0.6rem;
      }
      .chunk {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 0.5rem 0.6rem;
        border-radius: 0.75rem;
        transition: all 0.15s ease;
      }
      .chunk.is-active {
        background: #1f1f23;
        box-shadow: inset 0 0 0 1px rgba(239, 68, 68, 0.35);
      }
      .chunk.is-active .chunk-text {
        color: #ffffff;
      }
      .chunk-play {
        width: 1.9rem;
        height: 1.9rem;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        color: #71717a;
      }
      .chunk-text {
        color: #d4d4d8;
        font-size: 1.05rem;
        line-height: 1.9rem;
      }
      .word {
        cursor: pointer;
        border-radius: 0.3rem;
        padding: 0 0.1rem;
        transition: color 0.1s ease;
      }
      .word:hover,
      .word.is-picked {
        color: #ef4444;
      }
      .word.is-picked {
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      /* Thanh thời gian "đến lượt m" */
      .turn-track {
        height: 6px;
        border-radius: 4px;
        background: #18181b;
        box-shadow:
          inset 2px 2px 4px #0a0a0b,
          inset -2px -2px 4px #26262b;
        overflow: hidden;
      }
      .turn-bar {
        height: 100%;
        width: 0;
        background: #ef4444;
        box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
      }
      .history-item.is-playing .fa-play,
      .history-item:hover .fa-play {
        color: #ef4444;
      }
    </style>
  </head>
  <body
    class="min-h-screen flex items-center justify-center p-3 sm:p-6 font-sans antialiased bg-zinc-900"
  >
    <!-- =========================================
         APP CHÍNH (header + 2 tab)
         ========================================= -->
    <div
      id="app"
      class="neu-flat w-full max-w-3xl p-4 sm:p-8 flex flex-col gap-4 sm:gap-6"
    >
      <!-- Header & Navigation -->
      <div class="flex items-center gap-4 pb-2">
        <a
          href="../../index.html"
          class="neu-btn w-10 h-10 flex items-center justify-center text-gray-500 hover:text-red-500 transition"
          title="Back to Hub"
        >
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1
          class="text-xl sm:text-2xl font-extrabold tracking-widest text-red-500 uppercase flex items-center gap-2"
        >
          <i class="fa-solid fa-headphones"></i> Read Aloud
        </h1>
      </div>

      <!-- Tabs -->
      <div class="flex gap-3">
        <button
          data-tab="reader"
          class="tab-btn neu-btn neu-active px-4 py-2 text-sm text-gray-300 font-semibold flex items-center gap-2"
        >
          <i class="fa-solid fa-book-open-reader"></i> Reader
        </button>
        <button
          data-tab="learn"
          class="tab-btn neu-btn px-4 py-2 text-sm text-gray-300 font-semibold flex items-center gap-2"
        >
          <i class="fa-solid fa-language"></i> Learn EN
        </button>
      </div>

      <!-- ===== TAB 1: READER ===== -->
      <section id="tab-reader" class="flex flex-col gap-4">
        <div class="flex items-center justify-between">
          <label
            for="raw-text"
            class="text-xs font-bold text-gray-500 uppercase tracking-wider"
          >
            Input Text
          </label>
          <div class="flex items-center gap-3">
            <span id="reader-count" class="text-xs text-gray-500">0 words</span>
            <button
              id="reader-clear-btn"
              class="clear-btn text-xs text-gray-500 hover:text-red-500 transition flex items-center gap-1"
              title="Xoá nhanh"
            >
              <i class="fa-solid fa-eraser"></i> Xoá
            </button>
          </div>
        </div>
        <textarea
          id="raw-text"
          class="neu-pressed w-full min-h-[280px] p-4 text-white bg-transparent outline-none resize-y placeholder-gray-600"
          placeholder="Dán nội dung vào đây rồi bấm Render..."
        ></textarea>
        <div class="flex justify-end">
          <button
            id="render-btn"
            class="neu-btn px-6 py-2.5 text-sm text-red-500 font-bold flex items-center gap-2"
          >
            <i class="fa-solid fa-play"></i> Render
          </button>
        </div>
      </section>

      <!-- ===== TAB 2: LEARN EN ===== -->
      <section id="tab-learn" class="hidden flex flex-col gap-4">
        <!-- Công tắc chiều dịch: cờ bằng SVG vì Windows không hiện emoji cờ -->
        <div class="flex flex-wrap items-center justify-between gap-3">
          <button
            id="dir-btn"
            class="neu-btn px-4 py-2.5 text-sm text-gray-200 font-semibold"
            title="Đổi chiều dịch"
          >
            <span id="dir-inner" class="dir-inner flex items-center gap-3">
              <span class="flex items-center gap-2">
                <svg class="flag" viewBox="0 0 30 20" aria-hidden="true">
                  <rect width="30" height="20" fill="#da251d" />
                  <polygon
                    fill="#ffff00"
                    points="15.00,4.50 16.41,8.56 20.71,8.65 17.28,11.24 18.53,15.35 15.00,12.90 11.47,15.35 12.72,11.24 9.29,8.65 13.59,8.56"
                  />
                </svg>
                VI
              </span>
              <i class="fa-solid fa-arrow-right text-red-500 text-xs"></i>
              <span class="flex items-center gap-2">
                <svg class="flag" viewBox="0 0 60 30" aria-hidden="true">
                  <clipPath id="uk-clip">
                    <path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z" />
                  </clipPath>
                  <rect width="60" height="30" fill="#012169" />
                  <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6" />
                  <path
                    d="M0,0 L60,30 M60,0 L0,30"
                    clip-path="url(#uk-clip)"
                    stroke="#C8102E"
                    stroke-width="4"
                  />
                  <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10" />
                  <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6" />
                </svg>
                EN
              </span>
            </span>
          </button>
          <span class="text-xs text-gray-600">Ctrl + Enter để dịch</span>
        </div>

        <!-- Input -->
        <div class="flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <label
              id="src-label"
              for="src-text"
              class="text-xs font-bold text-gray-500 uppercase tracking-wider"
            >
              Tiếng Việt
            </label>
            <button
              id="learn-clear-btn"
              class="clear-btn text-xs text-gray-500 hover:text-red-500 transition flex items-center gap-1"
              title="Xoá nhanh"
            >
              <i class="fa-solid fa-eraser"></i> Xoá
            </button>
          </div>
          <textarea
            id="src-text"
            class="neu-pressed w-full min-h-[110px] p-4 text-white bg-transparent outline-none resize-y placeholder-gray-600"
          ></textarea>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-3">
          <label
            class="flex items-center gap-2 text-sm text-gray-400 cursor-pointer select-none"
          >
            <input id="auto-speak" type="checkbox" class="accent-red-500" checked />
            Dịch xong tự đọc
          </label>
          <button
            id="translate-btn"
            class="neu-btn px-6 py-2.5 text-sm text-red-500 font-bold flex items-center gap-2"
          >
            <i class="fa-solid fa-language"></i>
            <span id="translate-label">Dịch</span>
          </button>
        </div>

        <!-- Output -->
        <div class="flex flex-col gap-2">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">
              <span id="out-label">English</span>
              <span id="engine-tag" class="ml-2 normal-case font-normal text-gray-600"></span>
            </span>
            <div class="flex gap-2">
              <button
                id="speak-btn"
                class="neu-btn px-4 py-1.5 text-xs text-gray-300 font-semibold flex items-center gap-2"
                title="Đọc câu tiếng Anh"
              >
                <i class="fa-solid fa-volume-high"></i> Đọc EN
              </button>
              <button
                id="stop-btn"
                class="neu-btn px-4 py-1.5 text-xs text-gray-300 font-semibold flex items-center gap-2"
              >
                <i class="fa-solid fa-stop"></i> Dừng
              </button>
              <button
                id="copy-btn"
                class="neu-btn px-4 py-1.5 text-xs text-gray-300 font-semibold flex items-center gap-2"
              >
                <i class="fa-regular fa-copy"></i>
                <span id="copy-label">Copy</span>
              </button>
            </div>
          </div>
          <div
            id="out-text"
            class="neu-pressed w-full min-h-[90px] p-4 text-red-500 text-lg leading-relaxed"
          ></div>
        </div>

        <!-- ===== LUYỆN NHẠI (Shadowing) ===== -->
        <div id="shadow-box" class="flex flex-col gap-3">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">
              Luyện nhại
            </span>
            <div class="flex flex-wrap items-center gap-4 text-xs text-gray-500">
              <div class="flex items-center gap-2">
                Lặp
                <div class="flex gap-1.5" data-seg="repeat">
                  <button class="seg-btn neu-btn" data-value="1">1</button>
                  <button class="seg-btn neu-btn" data-value="3">3</button>
                  <button class="seg-btn neu-btn" data-value="5">5</button>
                </div>
              </div>
              <div class="flex items-center gap-2">
                Nghỉ
                <div class="flex gap-1.5" data-seg="pause">
                  <button class="seg-btn neu-btn" data-value="1">1x</button>
                  <button class="seg-btn neu-btn" data-value="1.5">1.5x</button>
                  <button class="seg-btn neu-btn" data-value="2">2x</button>
                </div>
              </div>
              <button
                id="shadow-btn"
                class="neu-btn px-4 py-1.5 text-xs text-red-500 font-bold flex items-center gap-2"
              >
                <i id="shadow-icon" class="fa-solid fa-microphone-lines"></i>
                <span id="shadow-label">Shadowing</span>
              </button>
            </div>
          </div>

          <!-- Trạng thái: đang nghe / đến lượt m nhại -->
          <div id="shadow-status" class="hidden flex items-center gap-3 text-xs">
            <span id="shadow-status-text" class="text-gray-400 whitespace-nowrap"></span>
            <div class="turn-track flex-1">
              <div id="turn-bar" class="turn-bar"></div>
            </div>
          </div>

          <!-- Các cụm từ: bấm ▶ để đọc cụm, bấm vào từ để xem IPA -->
          <div id="chunk-list" class="neu-pressed p-3 flex flex-col gap-2"></div>

          <!-- Ô phiên âm IPA -->
          <div id="ipa-box" class="neu-pressed px-4 py-3 text-sm text-gray-600">
            Bấm vào 1 từ để xem phiên âm IPA
          </div>
        </div>

        <!-- Cài đặt giọng đọc -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="flex flex-col gap-2">
            <label
              for="voice-select"
              class="text-xs font-bold text-gray-500 uppercase tracking-wider"
            >
              Giọng đọc
            </label>
            <div class="neu-pressed px-4 py-2.5">
              <select id="voice-select" class="wide-select w-full outline-none text-sm">
                <option>Đang tải giọng...</option>
              </select>
            </div>
          </div>
          <div class="flex flex-col gap-2">
            <label
              for="rate-range"
              class="text-xs font-bold text-gray-500 uppercase tracking-wider"
            >
              Tốc độ: <span id="rate-value" class="text-red-500">1.0x</span>
            </label>
            <div class="neu-pressed px-4 py-4 flex items-center">
              <input
                id="rate-range"
                type="range"
                min="0.5"
                max="1.5"
                step="0.1"
                value="1"
                class="full-range"
              />
            </div>
          </div>
        </div>

        <!-- Lịch sử: đặt trong "giếng" neu-pressed có padding để bóng item không bị cắt -->
        <div class="flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">
              Lịch sử gần đây
            </span>
            <button
              id="clear-history-btn"
              class="text-xs text-gray-600 hover:text-red-500 transition"
            >
              <i class="fa-solid fa-trash-can"></i> Xoá hết
            </button>
          </div>
          <div class="neu-pressed p-2">
            <ul id="history-list" class="history-scroll flex flex-col gap-3"></ul>
          </div>
        </div>
      </section>
    </div>

    <!-- =========================================
         READER VIEW (chỉ có nội dung, không chữ thừa)
         ========================================= -->
    <main
      id="reader-view"
      class="hidden neu-flat w-full max-w-3xl p-6 sm:p-10"
    >
      <div
        id="reader-content"
        class="text-xl leading-loose text-gray-200"
      ></div>
    </main>

    <!-- Nút quay lại: chỉ có icon, Edge không có chữ để đọc -->
    <button
      id="exit-reader-btn"
      class="hidden fixed top-4 right-4 neu-btn w-11 h-11 flex items-center justify-center text-gray-500 hover:text-red-500"
      aria-hidden="true"
      tabindex="-1"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>

    <script src="script.js"></script>
  </body>
</html>
